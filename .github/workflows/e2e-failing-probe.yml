name: E2E failing-suites probe (temporary)

# One-off probe: verify the five suites that failed in every weekly run
# (nebula, crunchyroll, dropout, per-site, presets). Delete after verdict.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e2e-failing-probe.yml'
      - 'e2e/helpers.js'
      - 'e2e/nebula.e2e.js'
      - 'e2e/crunchyroll.e2e.js'
      - 'e2e/dropout.e2e.js'
      - 'e2e/per-site.e2e.js'
      - 'e2e/presets.e2e.js'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build extension
        run: bun run build
      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome
      - name: Run the five previously failing suites
        run: |
          FAILED=""
          for suite in nebula crunchyroll dropout per-site presets; do
            echo ""
            echo "━━━ Running e2e/${suite}.e2e.js… ━━━"
            if ! bun "e2e/${suite}.e2e.js"; then
              FAILED="${FAILED} ${suite}"
            fi
          done
          if [ -n "${FAILED}" ]; then
            echo "❌ Failed suites:${FAILED}"
            exit 1
          fi
          echo "✅ All five suites passed"
