name: E2E max probe (temporary)

# One-off probe: does max.e2e.js pass on GitHub runners?
# Delete this file after the verdict.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e2e-max-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build extension
        run: bun run build
      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome
      - name: Run max suite
        run: bun e2e/max.e2e.js
