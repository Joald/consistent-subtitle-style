name: E2E netflix probe (temporary)

# One-off probe: does netflix.e2e.js pass on GitHub runners?
# Delete this file after the verdict.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/e2e-netflix-probe.yml'
      - 'e2e/helpers.js'
      - 'e2e/netflix.e2e.js'
      - 'src/main.ts'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build extension
        run: bun run build
      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome
      - name: Run netflix suite
        run: bun e2e/netflix.e2e.js
