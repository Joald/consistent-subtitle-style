name: E2E loader probe (temporary)

# Temporary verification for the loadVimeoPlayer fix (2026-10-25):
# runs only the two suites that use the shared Vimeo loader.
# Delete after a green run.

on:
  push:
    paths:
      - '.github/workflows/e2e-loader-probe.yml'
      - 'e2e/helpers.js'
      - 'e2e/per-site.e2e.js'
      - 'e2e/presets.e2e.js'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome

      - name: Run per-site and presets suites
        run: |
          FAILED_SUITES=""
          for suite in per-site presets; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Running e2e/${suite}.e2e.js…"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if ! bun "e2e/${suite}.e2e.js"; then
              FAILED_SUITES="${FAILED_SUITES} ${suite}"
            fi
          done
          if [ -n "${FAILED_SUITES}" ]; then
            echo ""
            echo "❌ Failed suites:${FAILED_SUITES}"
            exit 1
          fi
          echo ""
          echo "✅ Probe suites passed"
