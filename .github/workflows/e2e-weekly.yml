name: Weekly live-site E2E

# Regression net for site DOM changes (e.g. Nebula 2026-09-24: one extra
# wrapper div broke bg opacity/color because selectors pointed one level
# too shallow). Runs only the suites that need no login, against the live
# sites, every Monday morning. Login-gated suites (netflix, disneyplus,
# max, primevideo) are excluded — they cannot run unattended.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome

      - name: Run no-login live-site E2E suites
        run: |
          set -e
          for suite in nebula youtube vimeo crunchyroll dropout per-site presets; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Running e2e/${suite}.e2e.js…"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            bun "e2e/${suite}.e2e.js"
          done
