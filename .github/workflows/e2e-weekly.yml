name: Weekly live-site E2E

# Regression net for site DOM changes (e.g. Nebula 2026-09-24: one extra
# wrapper div broke bg opacity/color because selectors pointed one level
# too shallow). Runs every Monday morning — only suites that run
# unattended (no login needed).
#
# COVERAGE HONESTY — the suites fall into three classes:
#
#   1. Real player + real subtitles: nebula (free video), vimeo (free
#      public video with captions), dropout (embed.vhx.tv player).
#      Full live-player regression.
#   2. Live domain + injected subtitle DOM: crunchyroll, max, netflix,
#      disneyplus. These need a paid subscription, so the suite loads the
#      real public page (proving host detection + no CSP/script breakage)
#      and injects platform-shaped subtitle DOM. They exercise the CSS
#      pipeline — hostname detection, selector application, presets,
#      per-site overrides — NOT a real player. (Max currently 403s GitHub
#      runners; the suite still validates detection + CSS on the block
#      page. YouTube is a real page but captions are rarely present, so
#      it asserts init + live settings propagation instead.)
#   3. Logic-only: per-site, presets.
#
# Login-gated primevideo is excluded — it needs Amazon credentials and
# cannot run unattended.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome

      - name: Run no-login live-site E2E suites
        run: |
          set -e
          for suite in nebula youtube vimeo crunchyroll dropout max netflix disneyplus per-site presets; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  Running e2e/${suite}.e2e.js…"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            bun "e2e/${suite}.e2e.js"
          done
