name: E2E YouTube probe (temporary)

# Temporary verification for the YouTube consent-gate fix (2026-11-02):
# runs only the YouTube suite that failed in daily run 41380173725.
# Delete after a green run.

on:
  push:
    paths:
      - '.github/workflows/e2e-youtube-probe.yml'
      - 'e2e/youtube.e2e.js'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Install Chrome for Puppeteer
        run: bunx puppeteer browsers install chrome

      - name: Run YouTube suite
        run: |
          if ! bun "e2e/youtube.e2e.js"; then
            echo ""
            echo "❌ Failed suites: youtube"
            exit 1
          fi
          echo ""
          echo "✅ Probe suite passed"
